name: Mirror MVL sitemap

on:
  # 11:00 KST 갱신. GitHub 예약은 2~6시간 늦게 시작하므로 일찍 걸어 두고
  # 'Wait until 11:00 KST' 단계에서 11시까지 기다린다. 두 번째는 첫 번째가 빠질 때 대비.
  schedule:
    - cron: '30 20 * * *'  # 05:30 KST
    - cron: '0 22 * * *'   # 07:00 KST (backup)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not commit'
        type: boolean
        default: false

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait until 11:00 KST
        run: |
          target=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 11:00:00" +%s)
          wait=$(( target - $(date +%s) ))
          echo "now $(TZ=Asia/Seoul date '+%F %T') KST, target $(TZ=Asia/Seoul date -d @$target '+%F %T') KST, wait ${wait}s"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$wait" -gt 0 ]; then sleep "$wait"; fi

      - uses: actions/checkout@v4

      - name: Build mapping.json
        run: |
          python3 - <<'PYEOF'
          import urllib.request, re, json, sys
          # Cloudflare blocks the default Python-urllib UA (error 1010)
          req = urllib.request.Request('https://movementlab.kr/sitemap.xml', headers={'User-Agent': 'Mozilla/5.0 (compatible; family-sitemap-mirror/1.0)'})
          xml = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
          matches = re.findall(r'<loc>https://movementlab\.kr/product/([^/]+)/(\d+)/', xml)
          mapping = {slug: int(no) for slug, no in matches}
          if not mapping:
              sys.exit('No product URLs parsed; keeping existing mapping.json')
          try:
              old = json.load(open('mapping.json', encoding='utf-8'))
          except Exception:
              old = {}
          added = sorted(set(mapping) - set(old))
          removed = sorted(set(old) - set(mapping))
          with open('mapping.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, ensure_ascii=False, separators=(',',':'))
          print(f"Entries: {len(mapping)} (added {len(added)}, removed {len(removed)})")
          print("added:", added[:50])
          print("removed:", removed[:50])
          PYEOF

      - name: Commit if changed
        id: commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mapping.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update mapping" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: ${{ steps.commit.outputs.changed == 'true' }}
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-delay 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/mapping.json"
